{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Apprenant - SADDUR ACADÉMIE</title>
    <link rel="stylesheet" href="{% static 'territoire/css/styles_public.css' %}">
</head>
<body style="background-color: #f8fafc; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;">

    <div style="max-width: 450px; width: 100%; background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 6px solid #047857;">
        
        <div style="text-align: center; margin-bottom: 25px;">
            <span style="font-size: 35px;">⚡</span>
            <h1 style="color: #1e293b; font-size: 22px; margin: 10px 0 5px 0; font-weight: 800;">Espace Étudiant SADDUR</h1>
            <p style="color: #64748b; font-size: 14px; margin: 0;">Connectez-vous pour accéder à vos cours agropastoraux</p>
        </div>

        {% if error_message %}
            <div style="background-color: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: bold; margin-bottom: 20px; text-align: center;">
                {{ error_message }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #475569;">Votre identifiant (N° WhatsApp) :</label>
                <input type="text" name="username" placeholder="Ex: 699418222" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px;">
            </div>
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #475569;">Votre mot de passe :</label>
                <input type="password" name="password" placeholder="••••••••" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px;">
                <span style="font-size: 11px; color: #94a3b8; margin-top: 4px; display: block;">Par défaut : Saddur2026!</span>
            </div>

            <button type="submit" style="width: 100%; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px;">
                Se connecter à l'Académie
            </button>
        </form>

        <div style="text-align: center; margin-top: 25px; border-top: 1px solid #f1f5f9; padding-top: 15px;">
            <a href="{% url 'academie_public' %}" style="color: #64748b; text-decoration: none; font-size: 13px; font-weight: 600;">&larr; Retour au catalogue des cours</a>
        </div>
    </div>

</body>
</html>
